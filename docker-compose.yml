# Local run:            docker compose up --build        -> http://localhost:7860
# With a Qdrant server: docker compose --profile qdrant up --build
services:
  atlas:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: ${QDRANT_URL:-}
    volumes:
      - atlas-data:/home/user/app/.data

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  atlas-data:
  qdrant-data:
