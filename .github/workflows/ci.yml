name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  retrieval-quality:
    name: Retrieval quality gate (real models)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('atlas/config.py') }}
      - run: pip install -r requirements.txt
      # Fails the build if a change makes the right passage drop out of the top 5.
      - run: python -m eval.run_eval --retrieval-only --no-write --fail-under-hit5 0.85
